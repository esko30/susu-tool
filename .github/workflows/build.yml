name: Build APK

# Обычный push — проверочная сборка (APK в артефактах запуска).
# Push тега вида v2.1 — подписанная сборка и релиз на GitHub; приложение найдёт его как обновление.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты
        run: bash ./gradlew testReleaseUnitTest --no-daemon

      - name: Сборка
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export SIGNING_STORE_FILE="$RUNNER_TEMP/release.jks"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "Для релиза нужен ключ подписи: добавьте секреты репозитория" >&2; exit 1
          fi
          bash ./gradlew assembleRelease --no-daemon -PupdateRepo=${{ github.repository }}
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk "out/SUSU-Tool-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SUSU-Tool-apk
          path: out/*.apk

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
